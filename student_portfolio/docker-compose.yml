# Redis Stack = Redis + RedisJSON + RediSearch (+ RedisInsight, a browser GUI on port 8001)
services:
  redis:
    image: redis/redis-stack:latest
    container_name: portfolio-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # RedisInsight: open http://localhost:8001 to see your JSON documents
    environment:
      - REDIS_ARGS=--appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
